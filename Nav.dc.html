<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0d1117; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    select option { background: #21262d; color: #e6edf3; }
    textarea, input { font-family: inherit; }
    textarea { resize: none; }
    textarea:focus, input:focus, select:focus { outline: none; }
    button { border: none; font-family: inherit; }
    @keyframes tokenAppear { from { opacity: 0; transform: translateY(4px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes phaseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,160,0); } 50% { box-shadow: 0 0 20px 4px rgba(0,255,160,0.12); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes tpsJump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    @keyframes hlFlash { 0% { background: rgba(0,255,160,0.18); } 100% { background: transparent; } }
    @keyframes layerSweep { 0% { transform: translateX(-120%); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(120%); opacity: 0; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 2px; background: #30363d; outline: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #00ffa0; cursor: pointer; box-shadow: 0 0 0 3px rgba(0,255,160,0.15), 0 0 8px rgba(0,255,160,0.35); transition: box-shadow 0.15s ease; }
    input[type="range"]::-webkit-slider-thumb:hover { box-shadow: 0 0 0 5px rgba(0,255,160,0.22), 0 0 12px rgba(0,255,160,0.5); }
  </style>
</helmet>

<!-- 导航栏主体 -->
<div style="display:flex; flex-direction:column; width:56px; height:100%; background:#0d1117; border-right:1px solid #30363d; flex-shrink:0; padding-top:8px">
  <a href="./index.html" style="text-decoration:none">
    <div style="{{ navChat }}">
      <span style="font-size:17px">💬</span>
      <span>Chat</span>
    </div>
  </a>
  <a href="./Lab.dc.html" style="text-decoration:none">
    <div style="{{ navLab }}">
      <span style="font-size:17px">🧪</span>
      <span>Lab</span>
    </div>
  </a>
  <a href="./Code.dc.html" style="text-decoration:none">
    <div style="{{ navCode }}">
      <span style="font-size:17px">⌨</span>
      <span>Code</span>
    </div>
  </a>
  <a href="./Jargon.dc.html" style="text-decoration:none">
    <div style="{{ navJargon }}">
      <span style="font-size:17px">🔤</span>
      <span>黑话</span>
    </div>
  </a>
  <a href="./Job.dc.html" style="text-decoration:none">
    <div style="{{ navJob }}">
      <span style="font-size:17px">💼</span>
      <span>求职</span>
    </div>
  </a>
  <div onClick="{{ toggleSettings }}" style="margin-top:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:10px 0 12px; cursor:pointer; border-top:1px solid #21262d; color:#6e7681; font-size:9px; font-family:'JetBrains Mono',monospace; transition:color 0.15s">
    <span style="font-size:17px">⚙</span>
    <span>设置</span>
  </div>
</div>

<!-- 设置弹窗（fixed，覆盖全屏） -->
<sc-if value="{{ showSettings }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; display:flex; align-items:center; justify-content:center" onClick="{{ closeOnBg }}">
    <div style="background:#161b22; border:1px solid #30363d; border-radius:10px; width:480px; max-width:90vw; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.6)" onClick="{{ stopProp }}">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px">
        <span style="font-family:'JetBrains Mono',monospace; font-size:13px; color:#e6edf3; font-weight:600">⚙ 设置</span>
        <button onClick="{{ toggleSettings }}" style="background:transparent; border:none; color:#6e7681; font-size:18px; cursor:pointer; line-height:1">×</button>
      </div>
      <div style="margin-bottom:20px">
        <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#484f58; letter-spacing:0.08em; margin-bottom:8px">OPENROUTER API KEY</div>
        <input type="password" value="{{ apiKey }}" onInput="{{ updateApiKey }}" placeholder="sk-or-v1-..." style="width:100%; background:#0d1117; border:1px solid #30363d; border-radius:6px; color:#e6edf3; font-family:'JetBrains Mono',monospace; font-size:12px; padding:8px 12px; outline:none"></input>
        <div style="font-size:10px; color:#484f58; margin-top:5px; font-family:'JetBrains Mono',monospace">在 openrouter.ai 注册获取 Key，费用由你自行承担</div>
      </div>
      <button onClick="{{ saveSettings }}" style="width:100%; padding:9px; background:#00ffa0; border:none; border-radius:6px; color:#0d1117; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; cursor:pointer">保存</button>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:56,&quot;height&quot;:400},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chat&quot;,&quot;lab&quot;,&quot;code&quot;,&quot;jargon&quot;],&quot;default&quot;:&quot;chat&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    showSettings: false,
    apiKey: ''
  };

  componentDidMount() {
    try {
      const s = JSON.parse(localStorage.getItem('llm_viz_settings') || '{}');
      this.setState({ apiKey: s.apiKey || '' });
    } catch(e) {}
  }

  saveSettings() {
    const { apiKey } = this.state;
    try { localStorage.setItem('llm_viz_settings', JSON.stringify({ apiKey })); } catch(e) {}
    this.setState({ showSettings: false });
  }

  renderVals() {
    const { showSettings, apiKey } = this.state;
    const active = this.props.active || 'chat';
    const NS = (page) => ({
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      height: '56px', cursor: 'pointer',
      borderLeft: `2px solid ${active === page ? '#00ffa0' : 'transparent'}`,
      background: active === page ? 'rgba(0,255,160,0.06)' : 'transparent',
      color: active === page ? '#00ffa0' : '#6e7681',
      fontSize: '9px', fontFamily: '"Inter",sans-serif', gap: '3px',
      transition: 'all 0.15s ease', userSelect: 'none'
    });
    return {
      navChat: NS('chat'),
      navLab: NS('lab'),
      navCode: NS('code'),
      navJargon: NS('jargon'),
      navJob: NS('job'),
      showSettings,
      toggleSettings: () => this.setState(s => ({ showSettings: !s.showSettings })),
      closeOnBg: (e) => { if (e.target === e.currentTarget) this.setState({ showSettings: false }); },
      stopProp: (e) => e.stopPropagation(),
      apiKey,
      updateApiKey: (e) => this.setState({ apiKey: e.target.value }),
      saveSettings: () => this.saveSettings(),
    };
  }
}
</script>
</body>
</html>
